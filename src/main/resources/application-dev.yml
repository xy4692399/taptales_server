# ============================================================
#  Development Environment
# ============================================================
server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://192.168.10.144:3306/tap_tales?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# WeChat Mini Program config - replace with your own AppID/AppSecret
wechat:
  app-id: YOUR_WECHAT_APPID
  app-secret: YOUR_WECHAT_APPSECRET
  pay:
    mch-id: YOUR_MCH_ID
    api-key: YOUR_API_KEY
    notify-url: https://your-domain.com/api/pay/notify

# JWT config
jwt:
  secret: taptales-dev-secret-change-me
  expiration: 86400000

# File upload path (Windows)
file:
  upload-path: D:/taptales/uploads/