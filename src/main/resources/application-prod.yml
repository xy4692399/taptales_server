# ============================================================
#  Production Environment
# ============================================================
server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/tap_tales?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: root
    password: "#4692399XYfgy"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# WeChat Mini Program config
wechat:
  app-id: ${WECHAT_APPID:wx46b9c40eef053412}
  app-secret: ${WECHAT_APPSECRET:}
  pay:
    mch-id: ${WECHAT_MCH_ID:1001453655}
    api-v3-key: ${WECHAT_API_V3_KEY:}
    cert-serial-number: ${WECHAT_CERT_SERIAL_NUMBER:5D2170BEAB874E75F86FB67926042FA0EC6B7F3A}
    private-key-path: ${WECHAT_PRIVATE_KEY_PATH:/data/taptales/cert/apiclient_key.pem}
