# ============================================================
#  Production Environment
# ============================================================
server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/tap_tales?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# WeChat Mini Program config
wechat:
  app-id: ${WECHAT_APPID:}
  app-secret: ${WECHAT_APPSECRET:}
  pay:
    mch-id: ${WECHAT_MCH_ID:}
    api-key: ${WECHAT_API_KEY:}
    notify-url: ${WECHAT_NOTIFY_URL:https://your-domain.com/api/pay/notify}

# JWT config
jwt:
  secret: ${JWT_SECRET:taptales-prod-secret-change-me-in-production}
  expiration: 86400000

# File upload path
file:
  upload-path: ${FILE_UPLOAD_PATH:/data/taptales/uploads/}