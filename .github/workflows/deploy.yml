name: tap-tales deploy
on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Maven package
        run: mvn clean package -DskipTests

      - name: SCP jar to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "target/tap-tales-1.0.0.jar"
          target: "/home/ecs-user/mini-server/tap_tales/"
          overwrite: true

      - name: SSH restart service
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/ecs-user/mini-server/tap_tales
            [ -f tap-tales-1.0.0.jar ] && cp tap-tales-1.0.0.jar tap-tales-1.0.0.jar.bak
            sudo systemctl restart tap-tales
